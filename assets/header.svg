<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.l{opacity:0;animation:f 8s infinite}.b{animation-delay:4s}@keyframes f{0%,6%{opacity:0}12%,44%{opacity:1}50%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<g id="blobs"><circle cx="240" cy="110" r="170" fill="#7c3aed"><animate attributeName="cx" values="240;420;240" dur="14s" repeatCount="indefinite"/></circle><circle cx="920" cy="210" r="190" fill="#06b6d4"><animate attributeName="cx" values="920;760;920" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="210;150;210" dur="21s" repeatCount="indefinite"/></circle><circle cx="620" cy="40" r="140" fill="#ec4899"><animate attributeName="cy" values="40;260;40" dur="23s" repeatCount="indefinite"/></circle><circle cx="1090" cy="40" r="120" fill="#3b82f6"><animate attributeName="cx" values="1090;1010;1090" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="40;130;40" dur="16s" repeatCount="indefinite"/></circle><circle cx="120" cy="300" r="130" fill="#22d3ee"><animate attributeName="cx" values="120;240;120" dur="20s" repeatCount="indefinite"/><animate attributeName="cy" values="300;220;300" dur="26s" repeatCount="indefinite"/></circle></g>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/><feColorMatrix type="saturate" values="1.4"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
<clipPath id="outer"><rect width="1200" height="320" rx="28"/></clipPath>
<clipPath id="glass"><rect x="120" y="48" width="960" height="224" rx="36"/></clipPath>
</defs>
<g clip-path="url(#outer)">
<rect width="1200" height="320" fill="#0a0a14"/>
<use href="#blobs" xlink:href="#blobs" filter="url(#soft)" opacity=".9"/>
<rect x="120" y="58" width="960" height="224" rx="36" fill="#000" opacity=".45" filter="url(#shadow)"/>
<g clip-path="url(#glass)">
<rect width="1200" height="320" fill="#0a0a14"/>
<use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
<rect width="1200" height="320" fill="#fff" opacity=".10"/>
<rect x="120" y="48" width="960" height="112.0" fill="url(#shine)"/>
</g>
<rect x="120.75" y="48.75" width="958.5" height="222.5" rx="36" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<text x="600" y="150" text-anchor="middle" font-size="86" font-weight="700" fill="url(#ink)" letter-spacing="-2">surge</text>
<text x="600" y="194" text-anchor="middle" font-size="22" fill="#fff" fill-opacity=".78">cybersecurity geek · minecraft modder</text>
<text class="l a" x="600" y="236" text-anchor="middle" font-size="18" fill="#e9d5ff">privacy &amp; anti-fingerprinting tools</text>
<text class="l b" x="600" y="236" text-anchor="middle" font-size="18" fill="#a5f3fc">fabric &amp; neoforge mods</text>
</g>
</svg>
