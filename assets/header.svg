<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.l{opacity:0;animation:f 8s infinite}.b{animation-delay:4s}@keyframes f{0%,6%{opacity:0}12%,44%{opacity:1}50%,100%{opacity:0}}.sw{animation:sw 7s ease-in-out infinite}@keyframes sw{0%{transform:skewX(-20deg) translateX(0)}60%,100%{transform:skewX(-20deg) translateX(1900px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.3" fill="#fff" fill-opacity=".16"/></pattern>
<radialGradient id="vignette" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#1c1c22"/><stop offset="1" stop-color="#0b0b0e"/></radialGradient>
<filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="inner"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".3" stop-color="#fff" stop-opacity=".18"/><stop offset=".7" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".72"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="outer"><rect width="1200" height="320" rx="28"/></clipPath>
<clipPath id="all"><rect x="120" y="48" width="960" height="224" rx="40"/></clipPath>
</defs>
<g clip-path="url(#outer)">
<rect width="1200" height="320" fill="url(#vignette)"/>
<rect width="1200" height="320" fill="url(#dots)"/>
<rect x="120" y="56" width="960" height="224" rx="40" fill="#000" opacity=".55" filter="url(#shadow)"/>
<clipPath id="c0"><rect x="120" y="48" width="960" height="224" rx="40"/></clipPath>
<g clip-path="url(#c0)">
<rect x="120" y="48" width="960" height="224" fill="#16161c"/>
<g transform="translate(600.0 160.0) scale(1.18) translate(-600.0 -160.0)" filter="url(#frost)"><rect width="1200" height="320" fill="url(#dots)"/></g>
<rect x="120" y="48" width="960" height="224" fill="url(#body)"/>
<rect x="120" y="48" width="960" height="123.20000000000002" fill="url(#shine)"/>
<rect x="120" y="48" width="960" height="224" rx="40" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="10" filter="url(#inner)"/>
</g>
<g clip-path="url(#all)"><rect class="sw" x="-400" y="0" width="300" height="320" fill="url(#sweep)" transform="skewX(-20)"/></g>
<rect x="120.75" y="48.75" width="958.5" height="222.5" rx="39.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<text x="600" y="150" text-anchor="middle" font-size="86" font-weight="700" fill="url(#ink)" letter-spacing="-2">surge</text>
<text x="600" y="194" text-anchor="middle" font-size="22" fill="#fff" fill-opacity=".7">cybersecurity geek · minecraft modder</text>
<text class="l a" x="600" y="236" text-anchor="middle" font-size="18" fill="#fff" fill-opacity=".9">privacy &amp; anti-fingerprinting tools</text>
<text class="l b" x="600" y="236" text-anchor="middle" font-size="18" fill="#fff" fill-opacity=".9">fabric &amp; neoforge mods</text>
</g>
</svg>
